name: Generate RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check secrets
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ]; then echo "BSKY_HANDLE: NOT SET"; else echo "BSKY_HANDLE: set (${#BSKY_HANDLE} chars)"; fi
          if [ -z "$BSKY_APP_PASSWORD" ]; then echo "BSKY_APP_PASSWORD: NOT SET"; else echo "BSKY_APP_PASSWORD: set (${#BSKY_APP_PASSWORD} chars)"; fi

      - name: Generate feed
        run: python3 generate_feed.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_FEED_LIMIT: ${{ vars.BSKY_FEED_LIMIT || '100' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
